<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fitting Room</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- LEFT CONTROL PANEL -->
        <div class="control-panel">
            <h2>3D Body Fitting</h2>

            <!-- DYNAMIC PRODUCT INFORMATION CARD -->
            <div class="product-banner">
                <span id="product-title-display">Loading Product...</span>
                <span id="product-price-display">--</span>
            </div>

            <!-- 1. TARGET CATEGORY -->
            <div class="form-group">
                <label for="gender-type">Target Category:</label>
                <select id="gender-type" onchange="onGenderChange()">
                    <option value="men">Men</option>
                    <option value="women">Women</option>
                    <option value="kids">Kids</option>
                </select>
            </div>

            <!-- 2. BODY TYPE / SHAPE -->
            <div class="form-group" id="body-type-wrapper">
                <label>Body Type / Shape:</label>
                <div class="body-type-cards">
                    <div class="body-card active" data-value="mesomorph" onclick="selectBodyCard('mesomorph')">
                        <strong>Athletic</strong>
                        <small>Mesomorph</small>
                    </div>
                    <div class="body-card" data-value="ectomorph" onclick="selectBodyCard('ectomorph')">
                        <strong>Slim</strong>
                        <small>Ectomorph</small>
                    </div>
                    <div class="body-card" data-value="endomorph" onclick="selectBodyCard('endomorph')">
                        <strong>Heavy</strong>
                        <small>Endomorph</small>
                    </div>
                </div>
            </div>

            <!-- 3. MEASUREMENTS -->
            <div class="form-group">
                <div class="slider-header">
                    <label>Height:</label>
                    <div class="input-with-unit">
                        <input type="number" id="height-num" value="69">
                        <select id="height-unit" onchange="onUnitChange('height')">
                            <option value="in">in</option>
                            <option value="cm">cm</option>
                        </select>
                    </div>
                </div>
                <input type="range" id="height-slider" min="50" max="85" value="69" step="0.5">
            </div>

            <div class="form-group" id="group-chest">
                <div class="slider-header">
                    <label>Chest / Bust:</label>
                    <div class="input-with-unit">
                        <input type="number" id="chest-num" value="40">
                        <select id="chest-unit" onchange="onUnitChange('chest')">
                            <option value="in">in</option>
                            <option value="cm">cm</option>
                        </select>
                    </div>
                </div>
                <input type="range" id="chest-slider" min="20" max="60" value="40" step="0.5">
            </div>

            <div class="form-group">
                <div class="slider-header">
                    <label id="hip-label">Hip / Waist:</label>
                    <div class="input-with-unit">
                        <input type="number" id="hip-num" value="38">
                        <select id="hip-unit" onchange="onUnitChange('hip')">
                            <option value="in">in</option>
                            <option value="cm">cm</option>
                        </select>
                    </div>
                </div>
                <input type="range" id="hip-slider" min="20" max="60" value="38" step="0.5">
            </div>

            <!-- GARMENT SIZE SELECTION -->
            <div class="form-group">
                <label for="garment-size">Select Garment Size:</label>
                <select id="garment-size"></select>
            </div>

            <!-- FIT ANALYSIS CARD -->
            <div class="fit-analysis-card">
                <div class="analysis-header">
                    <span>Fit Analysis</span>
                    <span class="match-badge" id="fit-match-text">92% Match</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="fit-progress-fill"></div>
                </div>
                <div class="fit-result-details">
                    <p>Recommended Size: <strong id="rec-size">M</strong></p>
                    <p>Status: <span id="fit-status" class="status-fit">Perfect Fit</span></p>
                </div>
            </div>

            <button class="add-cart-btn" onclick="addToCart()">Add Selected Size to Cart</button>
        </div>

        <!-- RIGHT 3D VIEWPORT CANVAS -->
        <div id="canvas-container">
            <div class="view-overlay-tag">
                <span class="pulse-dot"></span> Realtime Dynamic Fitting
            </div>
            <button class="reset-view-btn" onclick="reset3DCamera()">⟲ Reset View</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
