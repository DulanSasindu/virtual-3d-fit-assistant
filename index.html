<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual 3D Fitting Assistant</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js Library එක CDN එක හරහා Load කිරීම -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Three.js GLTFLoader for importing 3D Models (.glb / .gltf) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div class="container">
        <!-- වම් පැත්තේ Measurement Controls -->
        <div class="controls">
            <h2>3D Body Fitting</h2>
            
            <div class="input-group">
                <label for="height">Height (cm): <span id="height-val">170</span></label>
                <input type="range" id="height" min="150" max="200" value="170">
            </div>

            <div class="input-group">
                <label for="chest">Chest (cm): <span id="chest-val">95</span></label>
                <input type="range" id="chest" min="70" max="130" value="95">
            </div>

            <div class="input-group">
                <label for="waist">Waist (cm): <span id="waist-val">80</span></label>
                <input type="range" id="waist" min="60" max="120" value="80">
            </div>
            <!-- Clothing Size Selector -->
            <div class="input-group">
                <label for="shirt-size">Select Garment Size:</label>
                <select id="shirt-size">
                    <option value="S">S (Small)</option>
                    <option value="M" selected>M (Medium)</option>
                    <option value="L">L (Large)</option>
                    <option value="XL">XL (Extra Large)</option>
                </select>
            </div>

            <!-- Fit Status Output -->
            <div class="fit-card">
                <h3>Fit Analysis</h3>
                <p>Recommended Size: <strong id="rec-size">M</strong></p>
                <p>Status: <span id="fit-status" class="status-fit">Perfect Fit</span></p>
            </div>

            <!-- Shirt Color Picker -->
            <div class="input-group">
                <label>Garment Color:</label>
                <div class="color-options">
                    <button type="button" class="color-btn btn-red" onclick="changeColor(0xef4444)"></button>
                    <button type="button" class="color-btn btn-green" onclick="changeColor(0x10b981)"></button>
                    <button type="button" class="color-btn btn-blue" onclick="changeColor(0x3b82f6)"></button>
                    <button type="button" class="color-btn btn-amber" onclick="changeColor(0xf59e0b)"></button>
                </div>
            </div>
            <!-- E-commerce Action Panel -->
            <div class="product-info-card">
                <h4>Casual Cotton Polo T-Shirt</h4>
                <p class="price">Rs. 3,490.00</p>
                <button id="add-to-cart-btn" onclick="addToCart()">Add Selected Size to Cart</button>
            </div>
        </div>

        <!-- දකුණු පැත්තේ 3D Canvas එක -->
        <div id="canvas-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
